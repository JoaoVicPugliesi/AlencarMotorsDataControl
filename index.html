<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alencar Motors - Controle de Dados</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsivity.css">
    <link rel="shortcut icon" href="images/alencar_motors_logo.svg" type="image/x-icon">
    <script src="https://kit.fontawesome.com/3acfdd9ae5.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>

<body>
    <nav>
        <section id="home">
            <div class="home-header">
                <a href="https://alencarmotors.com"><img class="home-logo" src="images/alencar_motors_logo.svg"
                        alt=""></a>
                <div class="header-anchors">
                    <a href="#home" draggable="false">Início</a>
                    <a href="#cards" draggable="false">Funcionários</a>
                    <a href="#admins" draggable="false">Administradores</a>
                </div>
                <div class="header-anchors-sandwich">
                    <button class="header-anchors-sandwich-btn" type="button">
                        <i class="fa-solid fa-bars"></i>
                    </button>

                    <nav class="header-anchors-sandwich-as">
                        <a href="#home" draggable="false">Início</a>
                        <a href="#cards" draggable="false">Funcionários</a>
                        <a href="#admins" draggable="false">Administradores</a>
                    </nav>
                </div>
            </div>
            <div class="home-main">
                <div class="home-main-header">
                    <h3>Controlador de Dados</h3>
                </div>
                <div>
                    <p>Aqui cada funcionário poderá declarar seus dados diários. organizando o processo.</p>
                </div>
            </div>
        </section>
        <section id="cards">
            <div class="dashboard">
                <div class="dashboard-graph">
                    <div class="dashboard-graph-display">
                        <div class="dashboard-graph-painel">
                            
                        </div>
                        <div class="dashboard-graph-display-header">
                            <div class="dashboard-card">
                            </div>

                            <div class="dashboard-card">
                            </div>

                            <div class="dashboard-card">
                            </div>

                        </div>

                        <div class="dashboard-graph-display-sources">
                           
                        </div>

                    </div>

                </div>
                <div class="dashboard-goals">
                    <div class="dashboard-goals-name">
                        <h3>Meta</h3>
                    </div>
                    <div class="dashboard-goals-display">

                    </div>
                    <div class="dashboard-goals-commands">
                        <button class="dashboard-goals-comeback-command">Voltar</button>
                    </div>
                </div>
                <div class="dashboard-name">
                    <h3></h3>
                </div>
                <div class="dashboard-display">

                </div>
                <div class="dashboard-commands">
                    <button class="dashboard-comeback-command">Voltar</button>
                    <button class="dashboard-command">Dashboard</button>
                    <button class="dashboard-goals-command">Metas</button>
                    <button class="dashboard-save-command">Salvar</button>
                </div>
            </div>
            <div class="cards-main">
                <div class="cards-main-header">
                    <h3>Paineis dos Funcionários</h3>
                </div>
                <div class="cards-main-slider">

                </div>
            </div>
        </section>
        <section id="admins">

        </section>
    </nav>
    <script src="index.js" type="module"></script>
</body>

</html>
