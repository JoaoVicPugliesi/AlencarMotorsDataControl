<!DOCTYPE html>
<html class="html" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alencar Motors - Controle de Dados</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/employees.css">
    <link rel="stylesheet" href="css/admins.css">
    <link rel="stylesheet" href="css/painel.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/messages.css">
    <link rel="stylesheet" href="css/diary.css">
    <link rel="stylesheet" href="css/commands.css">
    <link rel="stylesheet" href="css/responsivity.css">
    <link rel="shortcut icon" href="images/alencar_motors_logo.svg" type="image/x-icon">
    <script src="https://kit.fontawesome.com/3acfdd9ae5.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>

<body>
    <nav>
        <section id="home">
            <div class="home-header">
                <a href="https://alencarmotors.com"><img class="home-logo" src="images/alencar_motors_logo.svg"
                        alt=""></a>
                <div class="header-anchors">
                    <a href="#home" draggable="false">Início</a>
                    <a href="#employees" draggable="false">Funcionários</a>
                    <a href="#admins" draggable="false">Administradores</a>
                </div>
                <div class="header-anchors-sandwich">
                    <button class="header-anchors-sandwich-btn" type="button">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <nav class="header-anchors-sandwich-as">
                        <a href="#home" draggable="false">Início</a>
                        <a href="#employees" draggable="false">Funcionários</a>
                        <a href="#admins" draggable="false">Administradores</a>
                    </nav>
                </div>
            </div>
            <div class="home-main">
                <div class="home-main-header">
                    <h3>Controlador de Dados</h3>
                </div>
                <div>
                    <p>Aqui cada funcionário poderá declarar seus dados diários. organizando o processo.</p>
                </div>
            </div>
        </section>
        <section id="employees" draggable="false">
            <div class="employees-main" draggable="false">
                <div class="employees-main-painel">
                    <div class="employees-main-painel-diary">
                        <div class="diary-page">
                            <div class="diary-header">
                                <span class="diary-label">DIÁRIO</span>
                                <span class="diary-date">05 DE SETEMBRO, 2026</span>
                            </div>
                            <input class="employees-main-painel-diary-title" type="text" placeholder="Título do dia...">
                            <textarea class="employees-main-painel-diary-description"
                                placeholder="Escreva sobre o seu dia..."></textarea>
                            <div class="diary-commands">
                                <button class="diary-comeback-command">VOLTAR</button>
                                <button class="diary-save-command">SALVAR</button>
                            </div>
                        </div>
                    </div>
                    <div class="employees-main-painel-goals">
                        <div class="employees-main-painel-goals-name">
                            <h3>Meta</h3>
                        </div>
                        <div class="employees-main-painel-goals-display"></div>
                        <div class="employees-main-painel-goals-commands">
                            <button class="employees-main-painel-goals-comeback-command">Voltar</button>
                        </div>
                    </div>
                    <div class="employees-main-painel-name">
                        <h3></h3>
                    </div>
                    <div class="employees-main-painel-display"></div>
                    <div class="employees-main-painel-commands">
                        <button class="employees-main-painel-comeback-command">Voltar</button>
                        <button class="employees-main-painel-dashboard-command">Dashboard</button>
                        <button class="employees-main-painel-goals-command">Metas</button>
                        <button class="employees-main-painel-diary-command">Diário</button>
                        <button class="employees-main-painel-save-command">Salvar</button>
                    </div>
                </div>
                <div class="employees-main-header">
                    <h3>Paineis dos Funcionários</h3>
                </div>
                <div class="employees-main-slider"></div>
            </div>
        </section>
        <section id="admins">
            <div class="admins-main">
                <div class="admins-main-painel">
                    <div class="admins-main-painel-goals">
                        <div class="admins-main-painel-goals-display"></div>
                        <div class="admins-main-painel-goals-commands">
                            <button class="admins-main-painel-goals-save-command">SALVAR</button>
                            <button class="admins-main-painel-goals-comeback-command">Voltar</button>
                        </div>
                    </div>
                    <div class="admins-main-painel-header">
                        <h3></h3>
                    </div>
                    <div class="admins-main-painel-commands">
                        <button class="admins-main-painel-dashboard-command">Dashboard</button>
                        <button class="admins-main-painel-goals-command">Metas</button>
                        <button class="admins-main-painel-comeback-command">Voltar</button>
                    </div>
                </div>
                <div class="admins-main-header">
                    <h3>Paineis dos Administradores</h3>
                </div>
                <div class="admins-main-slider"></div>
            </div>
        </section>
    </nav>
    <script src="index.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>

</html>
